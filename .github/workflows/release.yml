name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build exe
        run: wails build

      - name: Checksums
        working-directory: build/bin
        run: |
          Get-FileHash cftunnelkit.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  cftunnelkit.exe" } | Out-File -Encoding ascii checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/*.exe
            build/bin/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build exe
        run: wails build -clean -ldflags "-X github.com/lsx-xyg/CFTunnelKit/internal/version.Version=${{ github.ref_name }}"

      - name: Checksums
        working-directory: build/bin
        run: |
          Get-FileHash cftunnelkit.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  cftunnelkit.exe" } | Out-File -Encoding ascii checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## CFTunnelKit

            Cloudflare Tunnel Windows 桌面管理器。

            ### 下载

            下载 `cftunnelkit.exe`，双击运行。首次打开如被 SmartScreen 拦截，点「更多信息 → 仍要运行」。

            ### 使用

            1. 打开后粘贴 Cloudflare API Token
            2. 创建/选择 Tunnel，点「启动」
            3. 进入 Ingress 添加 域名 → 本地端口 映射
            4. 关闭窗口自动隐藏到托盘

            详见 [README](https://github.com/lsx-xyg/CFTunnelKit#readme)。
          files: |
            build/bin/*.exe
            build/bin/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
